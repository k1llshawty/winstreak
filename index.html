<!DOCTYPE html>
<html lang="ru">
<head>

<meta name="theme-color" content="#05070a"><meta name="color-scheme" content="dark">
<style>
:root{--bg:#05070a;--card:#0b1218;--ink:#e6f6fa;--mut:#7f9aa5;--line:#17323c;--acc:#00e5ff;--accink:#021014;--ok:#3dffb0;--bad:#ff4d6d;--soft:#0e2a33;--glow:0 0 14px rgba(0,229,255,.45);
--head:"Chakra Petch","Segoe UI",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;min-width:0}html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;overflow-x:hidden;background:radial-gradient(120% 60% at 50% -10%,#08222b 0,var(--bg) 60%) fixed var(--bg);color:var(--ink);font:16px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 110px;width:100%}
h1{font:700 24px/1.1 var(--head);margin:6px 0 16px;color:var(--acc);text-shadow:0 0 6px rgba(0,229,255,.8),0 0 22px rgba(0,229,255,.5);letter-spacing:.5px}
h1 small{display:block;font:500 13px var(--head);color:var(--mut);text-shadow:none;margin-top:4px;letter-spacing:.3px}
h2{font:700 17px var(--head);margin:0 0 10px}
nav{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:12px;border:1px solid var(--line);margin-bottom:14px}
nav button{flex:1;padding:10px 4px;border:0;background:none;color:var(--mut);font:600 14px var(--head);border-radius:8px;cursor:pointer}
nav button.on{background:var(--acc);color:var(--accink);box-shadow:var(--glow)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;overflow:hidden}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input,select,textarea{display:block;width:100%;max-width:100%;font:inherit;font-size:16px;color:var(--ink);background:#060c10;border:1px solid var(--line);border-radius:8px;padding:10px;-webkit-appearance:none;appearance:none}
input[type=datetime-local]{min-height:44px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc);box-shadow:var(--glow)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cash{font:700 28px var(--head)!important;color:var(--acc);text-shadow:0 0 10px rgba(0,229,255,.4)}
.res{display:flex;justify-content:space-between;gap:10px;padding:5px 0}.ok{color:var(--ok)}.bad{color:var(--bad)}
.res.big{border-top:1px solid var(--line);margin-top:4px;padding-top:10px;font:700 18px var(--head)}
.cat{font:700 14px var(--head);color:var(--acc);margin:14px 0 4px;text-shadow:0 0 8px rgba(0,229,255,.4)}
.irow{padding:10px 0;border-top:1px solid var(--line)}
.irow .nm{display:flex;justify-content:space-between;gap:8px;font-weight:600;margin-bottom:6px}
.irow .nm span{font-weight:500;color:var(--ok)}
.btn{border:0;border-radius:10px;padding:13px 14px;font:700 16px var(--head);cursor:pointer;background:var(--acc);color:var(--accink);box-shadow:var(--glow)}
.btn.s{background:var(--soft);color:var(--acc);box-shadow:none}.btn.d{background:none;color:var(--bad);padding:8px 10px;box-shadow:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(5,7,10,.94);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;z-index:5}
.bar:empty{display:none}.bar .btn{flex:1;max-width:340px}.bar .btn.s{flex:0 0 auto}
.hist{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.hist:first-child{border-top:0}.hist small{color:var(--mut)}
pre{white-space:pre-wrap;word-break:break-word;font:14px/1.5 ui-monospace,Consolas,monospace;background:#060c10;padding:12px;border-radius:8px;border:1px solid var(--line);margin:0}
.empty{color:var(--mut);text-align:center;padding:24px 8px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--acc);color:var(--accink);padding:10px 16px;border-radius:10px;font:700 15px var(--head);z-index:9;box-shadow:var(--glow);white-space:nowrap}
.erow{display:grid;grid-template-columns:minmax(0,1fr) 108px 44px;gap:6px;margin-bottom:8px}
.pr{position:relative}.pr input{padding-right:28px;text-align:right}.pr span{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none}
.erow .btn{padding:0}
#who{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:-6px 0 12px;font-size:13px;color:var(--mut)}
#who:empty{display:none}#who button{background:none;border:1px solid var(--line);color:var(--acc);border-radius:8px;padding:6px 12px;font:600 13px var(--head);cursor:pointer}
.seg{display:flex;gap:6px;margin-bottom:8px}.seg button{flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:10px;font:600 13px var(--head);cursor:pointer}
.seg button.on{border-color:var(--acc);color:var(--acc);box-shadow:var(--glow)}
.rng{text-align:center;color:var(--mut);margin-bottom:12px;font:500 14px var(--head)}
.day h2{margin-bottom:8px}.day.today{border-color:var(--acc);box-shadow:var(--glow)}
.val{padding:10px 0;min-height:44px;font-weight:600;word-break:break-word}

/* ===== неон и анимации ===== */
:root{--acc2:#1e90ff;--glow2:0 0 0 1px rgba(0,229,255,.35),0 0 18px rgba(0,229,255,.35),0 0 42px rgba(30,144,255,.18)}
body::before{content:"";position:fixed;left:0;right:0;top:-40px;bottom:0;z-index:-1;pointer-events:none;
 background-image:linear-gradient(rgba(0,229,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.07) 1px,transparent 1px);
 background-size:40px 40px;-webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0,#000 0,transparent 75%);mask-image:radial-gradient(ellipse 90% 70% at 50% 0,#000 0,transparent 75%);
 animation:grid 5s linear infinite;will-change:transform}
body::after{content:"";position:fixed;left:50%;top:-120px;width:520px;height:260px;margin-left:-260px;z-index:-1;pointer-events:none;
 background:radial-gradient(closest-side,rgba(0,229,255,.22),transparent);animation:breathe 4.5s ease-in-out infinite}
@keyframes grid{to{transform:translateY(40px)}}
@keyframes breathe{50%{opacity:.45;transform:scale(1.15)}}
h1{position:relative;padding-bottom:10px;animation:flick 2.4s .1s both}
h1::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;border-radius:2px;
 background:linear-gradient(90deg,transparent,var(--acc),var(--acc2),transparent);background-size:200% 100%;box-shadow:0 0 10px var(--acc);animation:sweep 3.5s linear infinite}
@keyframes sweep{to{background-position:-200% 0}}
@keyframes flick{0%,6%,10%,14%{opacity:.25;text-shadow:none}8%,12%,18%,100%{opacity:1}}
nav{box-shadow:0 0 22px rgba(0,229,255,.08)}
nav button{transition:color .2s,background .25s,box-shadow .25s,transform .1s}
nav button:active{transform:scale(.96)}
nav button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 22px rgba(0,229,255,.8),0 0 40px rgba(30,144,255,.35)}}
.card{transition:border-color .25s,box-shadow .25s;background:linear-gradient(180deg,rgba(0,229,255,.045),transparent 40%),var(--card)}
.card:focus-within{border-color:rgba(0,229,255,.55);box-shadow:var(--glow2)}
.btn{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--acc),var(--acc2));transition:transform .12s,box-shadow .25s,filter .2s}
.btn.s,.btn.d{background:var(--soft)}.btn.d{background:none}
.btn:not(.s):not(.d)::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.btn:not(.s):not(.d){animation:pulse 3.2s ease-in-out infinite}
.btn:active{transform:scale(.96);filter:brightness(1.15)}
@media (hover:hover){.btn:hover{box-shadow:var(--glow2)}.card:hover{border-color:rgba(0,229,255,.4)}.hist:hover b{color:var(--acc);text-shadow:0 0 8px rgba(0,229,255,.6)}}
input,select,textarea{transition:border-color .2s,box-shadow .25s}
input:focus,select:focus,textarea:focus{box-shadow:var(--glow2)}
.cat{display:flex;align-items:center;gap:10px}.cat::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(0,229,255,.55),transparent);box-shadow:0 0 6px rgba(0,229,255,.5)}
.cash{animation:none;transition:text-shadow .3s}.cash:focus{text-shadow:0 0 16px rgba(0,229,255,.9)}
.res.big.ok{text-shadow:0 0 12px rgba(61,255,176,.7)}
.res.big.bad{text-shadow:0 0 12px rgba(255,77,109,.7);animation:alarm 1.6s ease-in-out infinite}
@keyframes alarm{50%{opacity:.6}}
.day.today{animation:today 2.6s ease-in-out infinite}
@keyframes today{50%{box-shadow:0 0 28px rgba(0,229,255,.55),0 0 0 1px rgba(0,229,255,.7)}}
.seg button{transition:all .2s}.seg button:active{transform:scale(.96)}
.irow .nm span{text-shadow:0 0 8px rgba(61,255,176,.5);transition:transform .2s}
#v.anim>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
#v.anim>:nth-child(2){animation-delay:.05s}#v.anim>:nth-child(3){animation-delay:.1s}#v.anim>:nth-child(4){animation-delay:.15s}
#v.anim>:nth-child(5){animation-delay:.2s}#v.anim>:nth-child(6){animation-delay:.25s}#v.anim>:nth-child(n+7){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.toast{animation:toast .35s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes toast{from{opacity:0;transform:translate(-50%,16px) scale(.9)}}
#nk,#pw{font-size:18px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<h1>WIN STREAK<small>рабочая панель клуба</small></h1><div id="who"></div>
<nav id="nav"><button data-t="shift" class="on">Смена</button><button data-t="sched">График</button><button data-t="hist">История</button><button data-t="items">Товары</button></nav>
<main id="v"></main>
</div>
<div class="bar" id="bar"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
// ВСТАВЬТЕ СЮДА ДАННЫЕ ИЗ FIREBASE (Project settings → Your apps → firebaseConfig).
// Пока apiKey пустой, приложение работает локально, без общей базы.
const FIREBASE_CONFIG={apiKey:"AIzaSyAKyk1XIPGPijv5NXBw6WioX8cz84HopzI",authDomain:"winstreakpcclub.firebaseapp.com",projectId:"winstreakpcclub",storageBucket:"winstreakpcclub.firebasestorage.app",messagingSenderId:"1031724956829",appId:"1:1031724956829:web:8e22a550c225fd1109e874"};
</script>
<script>
const DEF=[["Энергетики","Адреналин",200],["Энергетики","Монстр",300],["Напитки","Фанта",220],["Напитки","Маунти Дью",0],["Напитки","Липтон",140],["Напитки","Кола",140],["Напитки","Вода",100],["Еда","Багет",170],["Еда","Шаурма",230],["Еда","Сэндвич",200]];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rub=n=>(Math.round(n)||0).toLocaleString("ru-RU")+" ₽";
const num=v=>{const n=parseInt(v,10);return isNaN(n)?0:n};
function ld(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let items=ld("ws_items2",null)||DEF.map((x,i)=>({id:i+1,cat:x[0],name:x[1],price:x[2]}));
const CLOUD=!!(window.firebase&&FIREBASE_CONFIG.apiKey);
let reports=CLOUD?[]:ld("ws_reports",[]);
let db=null,auth=null,me=CLOUD?null:{name:"",role:"owner"},authed=!CLOUD,booting=CLOUD,unsubs=[],loginErr="",tm,tms,pendI=false,pendS=false;
let sched=CLOUD?{}:ld("ws_sched",{}),wk=0;const dirty=new Set();
const cache=()=>{if(!CLOUD)sv("ws_reports",reports)};
const col=n=>db.collection("clubs").doc("streak77").collection(n);
const USERS={"killsouthgarden":{e:"killsouthgarden@winstreak.app",role:"owner",name:"killsouthgarden"},"shak2o":{e:"shak2o@winstreak.app",role:"admin",name:"shak2o"},"администратор":{e:"admin@winstreak.app",role:"staff",name:"Администратор"}};
const ROLE={owner:"главный админ",admin:"админ",staff:"сотрудник"};
const canEdit=()=>!!me&&me.role!=="staff";
let draft=ld("ws_draft",null);
let tab="shift",open=null;
const nowLocal=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
function fmt(iso){const d=new Date(iso);return d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric"})+" "+d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}
function newDraft(){
  const last=reports[0],prev={};
  if(last)last.items.forEach(i=>prev[i.name]=i.end);
  return{date:nowLocal(),admin:(me&&me.name)||(last?last.admin:""),shift:"Дневная",cash:"",float:last?last.float:0,system:"",note:"",
    inv:Object.fromEntries(items.map(i=>[i.id,{s:prev[i.name]??"",e:""}]))};
}
if(!draft)draft=newDraft();
const save=()=>sv("ws_draft",draft);
function saveItems(){sv("ws_items2",items);if(CLOUD&&authed&&canEdit()){pendI=true;clearTimeout(tm);tm=setTimeout(pushItems,600)}}
const PRICES={"Адреналин":200,"Фанта":220,"Багет":170,"Сэндвич":200,"Липтон":140,"Вода":100,"Кола":140,"Монстр":300,"Шаурма":230};
function migrate(){
  items.forEach(i=>{if(!i.price&&PRICES[i.name])i.price=PRICES[i.name]});
  if(!items.some(i=>i.name==="Кола"))items.push({id:Date.now(),cat:"Напитки",name:"Кола",price:140});
}
function pushItems(){col("meta").doc("items").set({list:items,v:2}).catch(()=>{}).then(()=>{pendI=false})}
function prefill(){const last=reports[0];if(!last)return;const prev={};last.items.forEach(i=>prev[i.name]=i.end);
  items.forEach(i=>{const r=draft.inv[i.id];if(r&&!r.t&&prev[i.name]!==undefined)r.s=prev[i.name]})}
function refresh(){prefill();const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;render()}
function onErr(e){if(e&&e.code==="permission-denied")toast("Нет доступа к базе. Проверьте правила Firebase")}
function initFb(){if(!db){firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();auth=firebase.auth()}}
async function login(nick,pass){
  const u=USERS[String(nick).trim().toLowerCase()];
  if(!u||!pass){loginErr="Неверный ник или пароль";render();return}
  try{initFb();await auth.signInWithEmailAndPassword(u.e,pass)}
  catch(e){const c=e.code||"";loginErr=/invalid|wrong|not-found|credential/.test(c)?"Неверный ник или пароль":c==="auth/operation-not-allowed"?"В Firebase не включён вход по почте и паролю":c==="auth/too-many-requests"?"Слишком много попыток, подождите минуту":"Нет связи с базой. Проверьте интернет";render()}
}
function startAuth(){
  initFb();
  auth.onAuthStateChanged(u=>{
    booting=false;const info=u&&Object.values(USERS).find(x=>x.e===u.email);
    if(info){me=info;authed=true;loginErr="";draft.admin=info.name;save();listen();render();pop()}
    else{unsubs.forEach(f=>f());unsubs=[];me=null;authed=false;reports=[];sched={};render()}
  });
}
function listen(){
  unsubs.forEach(f=>f());unsubs=[];
  unsubs.push(col("meta").doc("items").onSnapshot(d=>{if(pendI)return;
    if(d.exists&&d.data().list){items=d.data().list;if((d.data().v||0)<2&&canEdit()){migrate();pushItems()}sv("ws_items2",items);refresh()}
    else if(!d.exists&&canEdit()){migrate();pushItems()}},onErr));
  unsubs.push(col("reports").orderBy("date","desc").limit(100).onSnapshot(q=>{reports=q.docs.map(x=>x.data());refresh()},onErr));
  unsubs.push(col("schedule").orderBy("week","desc").limit(12).onSnapshot(q=>{if(pendS)return;sched={};q.docs.forEach(x=>{const v=x.data();sched[v.week]=v});refresh()},onErr));
}
function saveReport(r){
  if(CLOUD)col("reports").doc(String(r.id)).set(r).catch(()=>toast("Не удалось сохранить в облако"));
  reports.unshift(r);cache();
}
function viewLogin(){
  $("#bar").innerHTML="";
  $("#v").innerHTML=booting?`<div class="empty">Загрузка…</div>`:`<div class="card"><h2>Вход</h2><label>Ник</label><input id="nk" autocomplete="username" autocapitalize="none"><label style="margin-top:10px">Пароль</label><input id="pw" type="password" autocomplete="current-password"><div class="bad" style="margin-top:8px">${esc(loginErr)}</div><button class="btn" id="go" style="margin-top:10px;width:100%">Войти</button></div>`;
}
function calc(){
  const total=num(draft.cash),exp=num(draft.float)+num(draft.system);
  return{total,exp,diff:total-exp};
}
function itemRows(){
  return items.map(i=>{const r=draft.inv[i.id]||(draft.inv[i.id]={s:"",e:""});
    const sold=num(r.s)-num(r.e);return{...i,start:num(r.s),end:num(r.e),sold,filled:r.e!==""}});
}
function pop(){const v=$("#v");v.classList.remove("anim");void v.offsetWidth;v.classList.add("anim")}
function render(){
  $("#nav").style.display=authed?"":"none";
  $("#who").innerHTML=authed&&CLOUD&&me?`<span>${esc(me.name)} · ${ROLE[me.role]}</span><button id="out">Выйти</button>`:"";
  if(!authed){viewLogin();return}
  if(tab==="items"&&!canEdit())tab="shift";
  document.querySelectorAll("nav button").forEach(b=>{b.classList.toggle("on",b.dataset.t===tab);if(b.dataset.t==="items")b.style.display=canEdit()?"":"none"});
  ({shift:viewShift,sched:viewSched,hist:viewHist,items:viewItems})[tab]();
}
function viewShift(){
  const c=calc(),cats=[...new Set(items.map(i=>i.cat))];
  let h=`<div class="card"><div class="g2" style="grid-template-columns:minmax(0,1fr)"><div><label>Дата и время</label><input type="datetime-local" data-f="date" value="${draft.date}"></div>
  <div><label>Смена</label><select data-f="shift">${["Дневная","Ночная"].map(s=>`<option${draft.shift===s?" selected":""}>${s}</option>`).join("")}</select></div></div>
  <div style="margin-top:10px"><label>Администратор</label><input data-f="admin" ${CLOUD?"readonly":""} value="${esc(draft.admin)}" placeholder="Имя"></div></div>`;
  h+=`<div class="card"><h2>Касса</h2><label>Итоговая сумма наличных в кассе, ₽</label><input type="number" inputmode="numeric" min="0" data-f="cash" value="${draft.cash??""}" placeholder="0" class="cash"></div>`;
  h+=`<div class="card"><h2>Сверка</h2><div class="g2"><div><label>Размен на начало смены, ₽</label><input type="number" inputmode="numeric" data-f="float" value="${draft.float}"></div>
  <div><label>Наличные по системе, ₽</label><input type="number" inputmode="numeric" data-f="system" value="${draft.system}" placeholder="из программы клуба"></div></div>
  <div id="rec" style="margin-top:10px"></div></div>`;
  h+=`<div class="card"><h2>Остатки в холодильниках</h2><label>Количество на начало смены подтянулось из прошлого отчёта. В конце смены впишите остаток.</label>`;
  cats.forEach(cat=>{h+=`<div class="cat">${esc(cat)}</div>`;
    itemRows().filter(i=>i.cat===cat).forEach(i=>{h+=`<div class="irow"><div class="nm">${esc(i.name)}<span id="sd${i.id}">${i.filled?"продано "+i.sold:""}</span></div>
    <div class="g2"><div><label>На начало смены</label><input type="number" inputmode="numeric" min="0" data-i="${i.id}" data-k="s" value="${draft.inv[i.id].s}"></div>
    <div><label>Остаток на конец</label><input type="number" inputmode="numeric" min="0" data-i="${i.id}" data-k="e" value="${draft.inv[i.id].e}"></div></div></div>`})});
  h+=`</div><div class="card"><label>Заметка по смене</label><textarea rows="2" data-f="note" placeholder="Что сломалось, что докупить…">${esc(draft.note)}</textarea></div>`;
  $("#v").innerHTML=h;
  $("#bar").innerHTML=`<button class="btn s" id="reset">Очистить</button><button class="btn" id="fin">Закрыть смену</button>`;
  paintRec();
}
function paintRec(){
  const c=calc(),el=$("#rec");if(!el)return;
  const cls=c.diff===0?"ok":"bad",txt=c.diff===0?"Сходится":c.diff>0?"Излишек":"Недостача";
  el.innerHTML=`<div class="res"><span>Должно быть в кассе</span><b>${rub(c.exp)}</b></div><div class="res"><span>По факту</span><b>${rub(c.total)}</b></div><div class="res big ${cls}"><span>${txt}</span><b>${c.diff>0?"+":""}${rub(c.diff)}</b></div>`;
}
function snapshot(){
  const c=calc(),rows=itemRows();
  return{id:Date.now(),date:draft.date,admin:draft.admin.trim()||"—",shift:draft.shift,total:c.total,float:num(draft.float),system:num(draft.system),exp:c.exp,diff:c.diff,note:draft.note.trim(),
    items:rows.map(r=>({name:r.name,cat:r.cat,price:r.price,start:r.start,end:r.end,sold:r.sold}))};
}
function report(r){
  let t=`Win Streak — смена ${r.shift.toLowerCase()}\n${fmt(r.date)}\nАдминистратор: ${r.admin}\n\nКАССА\nПо факту: ${rub(r.total)}\nРазмен на начало: ${rub(r.float)}\nНаличные по системе: ${rub(r.system)}\nДолжно быть: ${rub(r.exp)}\n${r.diff===0?"Сходится":(r.diff>0?"Излишек: +":"Недостача: ")+rub(r.diff)}\n`;
  [...new Set(r.items.map(i=>i.cat))].forEach(cat=>{t+=`\n${cat.toUpperCase()} (на начало / остаток / продано)\n`;
    r.items.filter(i=>i.cat===cat).forEach(i=>t+=`${i.name}: ${i.start} / ${i.end} / ${i.sold}\n`)});
  const sum=r.items.reduce((a,i)=>a+Math.max(0,i.sold)*i.price,0);
  if(sum>0)t+=`\nТовары проданы на ≈ ${rub(sum)}\n`;
  if(r.note)t+=`\nЗаметка: ${r.note}\n`;
  return t;
}
function viewHist(){
  $("#bar").innerHTML="";
  if(open!==null){const r=reports.find(x=>x.id===open);if(r){
    $("#v").innerHTML=`<div class="card"><pre>${esc(report(r))}</pre><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn" id="cp">Копировать</button><button class="btn s" id="bk">Назад</button>${canEdit()?'<button class="btn d" id="del">Удалить</button>':""}</div></div>`;
    $("#cp").onclick=()=>copy(report(r));$("#bk").onclick=()=>{open=null;render()};
    if($("#del"))$("#del").onclick=()=>{if(confirm("Удалить этот отчёт?")){reports=reports.filter(x=>x.id!==r.id);cache();if(CLOUD)col("reports").doc(String(r.id)).delete();open=null;render()}};return}}
  const old=CLOUD?ld("ws_reports",[]):[];
  const mg=old.length?`<div class="card"><label>В этом браузере остались отчёты, которых нет в общей базе: ${old.length}.</label><button class="btn s" id="mig" style="margin-top:8px;width:100%">Перенести в общую базу</button></div>`:"";
  $("#v").innerHTML=mg+(reports.length?`<div class="card">${reports.map(r=>`<div class="hist" data-r="${r.id}"><div><b>${fmt(r.date)}</b><br><small>${esc(r.admin)} · ${r.shift.toLowerCase()}</small></div><div style="text-align:right"><b>${rub(r.total)}</b><br><small class="${r.diff===0?"ok":"bad"}">${r.diff===0?"сходится":(r.diff>0?"+":"")+rub(r.diff)}</small></div></div>`).join("")}</div>`:`<div class="empty">Отчётов пока нет. Закройте первую смену — она появится здесь.</div>`);
}
function viewItems(){
  $("#bar").innerHTML="";
  const cats=[...new Set(items.map(i=>i.cat))],all=[...new Set([...cats,"Энергетики","Напитки","Еда"])];
  let h=`<div class="card"><h2>Товары и цены</h2><label>Название и цену можно менять прямо в списке, изменения сохраняются сами.</label>`;
  cats.forEach(c=>{h+=`<div class="cat">${esc(c)}</div>`;
    items.filter(i=>i.cat===c).forEach(i=>h+=`<div class="erow"><input data-e="${i.id}" data-k="name" value="${esc(i.name)}" aria-label="Название"><div class="pr"><input type="number" inputmode="numeric" min="0" data-e="${i.id}" data-k="price" value="${i.price||""}" placeholder="0" aria-label="Цена"><span>₽</span></div><button class="btn d" data-x="${i.id}" aria-label="Удалить ${esc(i.name)}">✕</button></div>`)});
  h+=`</div><div class="card"><h2>Добавить товар</h2><div class="g2"><div><label>Категория</label><select id="nc">${all.map(c=>`<option>${esc(c)}</option>`).join("")}</select></div><div><label>Цена, ₽</label><input id="np" type="number" inputmode="numeric" min="0" placeholder="0"></div></div><div style="margin-top:10px"><label>Название</label><input id="nn"></div><button class="btn" id="add" style="margin-top:10px;width:100%">Добавить</button></div>`+"";
  $("#v").innerHTML=h;
}
const DAYS=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"],MON=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"],WN=["Прошлая неделя","Эта неделя","Следующая неделя"];
const pad=n=>String(n).padStart(2,"0"),keyOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const blank=()=>Array.from({length:7},()=>({d:"",n:""}));
function weekStart(o){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+o*7);return d}
function putSched(doc){
  doc.by=(me&&me.name)||"";sched[doc.week]=doc;if(!CLOUD)sv("ws_sched",sched);
  if(CLOUD){pendS=true;dirty.add(doc.week);clearTimeout(tms);tms=setTimeout(()=>{
    const ws=[...dirty];dirty.clear();
    Promise.all(ws.map(w=>col("schedule").doc(w).set(sched[w]))).catch(()=>toast("Не удалось сохранить график")).then(()=>{pendS=false})},500)}
}
function viewSched(){
  $("#bar").innerHTML="";
  const st=weekStart(wk),key=keyOf(st),end=new Date(st);end.setDate(end.getDate()+6);
  const doc=sched[key],ed=canEdit();
  let h=`<div class="seg">${[-1,0,1].map(o=>`<button data-w="${o}" class="${o===wk?"on":""}">${WN[o+1]}</button>`).join("")}</div><div class="rng">${st.getDate()} ${MON[st.getMonth()]} – ${end.getDate()} ${MON[end.getMonth()]}</div>`;
  if(!doc){
    const canCopy=!!sched[keyOf(weekStart(wk-1))];
    h+=`<div class="card empty">${wk<0?"Расписание на прошлую неделю отсутствует":wk===0?"Расписание на эту неделю ещё не составлено":"Расписание на следующую неделю ещё не составлено"}`;
    if(ed&&wk>=0)h+=`<div style="display:grid;gap:8px;margin-top:14px"><button class="btn" id="newS">Составить расписание</button>${canCopy?'<button class="btn s" id="cpS">Скопировать с прошлой недели</button>':""}</div>`;
    h+=`</div>`;
  }else{
    const today=keyOf(new Date());
    h+=doc.days.map((dy,i)=>{const d=new Date(st);d.setDate(d.getDate()+i);const t=keyOf(d)===today;
      const cell=(f,l)=>ed?`<div><label>${l}</label><input data-s="${i}" data-sf="${f}" value="${esc(dy[f])}" placeholder="Кто работает" autocomplete="off"></div>`:`<div><label>${l}</label><div class="val">${esc(dy[f])||"—"}</div></div>`;
      return `<div class="card day${t?" today":""}"><h2>${DAYS[i]}, ${d.getDate()} ${MON[d.getMonth()]}${t?" · сегодня":""}</h2><div class="g2">${cell("d","День")}${cell("n","Ночь")}</div></div>`}).join("");
    if(ed)h+=`<div class="card"><label>Изменения сохраняются сами${doc.by?`. Последняя правка: ${esc(doc.by)}`:""}.</label><button class="btn d" id="clrS" style="width:100%;margin-top:6px">Очистить неделю</button></div>`;
  }
  $("#v").innerHTML=h;
}
function copy(t){
  const ok=()=>toast("Скопировано");
  try{navigator.clipboard.writeText(t).then(ok,()=>fb(t))}catch(e){fb(t)}
  function fb(t){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){}a.remove()}
}
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.f){draft[t.dataset.f]=t.value;save();if(["float","system","cash"].includes(t.dataset.f))paintRec()}
  else if(t.dataset.i){draft.inv[t.dataset.i][t.dataset.k]=t.value;if(t.dataset.k==="s")draft.inv[t.dataset.i].t=1;save();const r=draft.inv[t.dataset.i];$("#sd"+t.dataset.i).textContent=r.e!==""?"продано "+(num(r.s)-num(r.e)):""}
  else if(t.dataset.s!==undefined){const dc=sched[keyOf(weekStart(wk))];if(dc){dc.days[t.dataset.s][t.dataset.sf]=t.value;putSched(dc)}}
  else if(t.dataset.e){const it=items.find(x=>x.id==t.dataset.e);it[t.dataset.k]=t.dataset.k==="price"?num(t.value):t.value;saveItems()}
});
document.addEventListener("click",e=>{
  const t=e.target.closest("button,.hist");if(!t)return;
  if(t.dataset.t){tab=t.dataset.t;open=null;render();pop()}
  else if(t.dataset.w!==undefined){wk=+t.dataset.w;render();pop()}
  else if(t.id==="newS"){putSched({week:keyOf(weekStart(wk)),days:blank()});render()}
  else if(t.id==="cpS"){putSched({week:keyOf(weekStart(wk)),days:JSON.parse(JSON.stringify(sched[keyOf(weekStart(wk-1))].days))});render()}
  else if(t.id==="clrS"){if(confirm("Очистить расписание этой недели?")){putSched({week:keyOf(weekStart(wk)),days:blank()});render()}}
  else if(t.dataset.r){open=+t.dataset.r;render()}
  else if(t.id==="go")login($("#nk").value,$("#pw").value)
  else if(t.id==="mig"){const b=db.batch();ld("ws_reports",[]).forEach(r=>b.set(col("reports").doc(String(r.id)),r));
    b.commit().then(()=>{sv("ws_reports",[]);toast("Отчёты перенесены");render()},()=>toast("Не удалось перенести"))}
  else if(t.id==="out"){auth.signOut()}
  else if(t.id==="reset"){if(confirm("Очистить введённые данные смены?")){draft=newDraft();save();render()}}
  else if(t.id==="fin"){
    const missing=itemRows().filter(i=>!i.filled).length;
    if(missing&&!confirm("Остаток не введён у позиций: "+missing+". Они сохранятся как 0. Продолжить?"))return;
    const r=snapshot();saveReport(r);draft=newDraft();save();
    tab="hist";open=r.id;render();toast("Смена сохранена");
  }
  else if(t.dataset.x){if(confirm("Удалить товар из списка? В старых отчётах он останется.")){items=items.filter(i=>i.id!=t.dataset.x);saveItems();viewItems()}}
  else if(t.id==="add"){const n=$("#nn").value.trim();if(!n)return;items.push({id:Date.now(),cat:$("#nc").value,name:n,price:num($("#np").value)});saveItems();draft.inv=draft.inv||{};viewItems()}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.target.id==="nk"||e.target.id==="pw"))login($("#nk").value,$("#pw").value)});
if(!CLOUD&&ld("ws_items_v",0)<2){migrate();sv("ws_items_v",2);sv("ws_items2",items)}
if(CLOUD)startAuth();else render();
</script>
</body>
</html>
